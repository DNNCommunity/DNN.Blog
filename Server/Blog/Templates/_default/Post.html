<article class="bbs-listarticle">
  [subtemplate|ListImage.html|post:hasimage]
  <div class="bbs-listarticle__body">
    <div class="supertitle">[subtemplate|Cat.html|categories]</div>
    <h2 class="bbs-listarticle__title"><a href="[Post:link]">[post:localizedtitle]</a></h2>
    <div class="bbs-listarticle__byline">
      <a class="bbs-author-name" href="[urls:module|true]author=[post:CreatedByUserID]">[post:DisplayName]</a>
      <span class="bbs-byline-sep" aria-hidden="true"></span>
      <span data-time="[post:PublishedOnDate|yyyy-MM-dd HH:mm:ss]" class="moment">[post:PublishedOnDate|yyyy-MM-dd]</span>
[if|1][Post:published][=]False[/if]
      <span class="unpublished">[resx:Unpublished]</span>
[endif|1]
    </div>
    <div class="summary">
      [post:localizedsummary]
    </div>
  </div>
</article>
